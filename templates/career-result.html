{% extends 'base.html' %}

{% block title %}Career Roadmap Result{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/career.css') }}" />{% endblock %}

{% block content %}
<section class="container results-layout">
  <div class="results-header">
    <h1>Your Personalized Career Plan</h1>
    <div class="action-row">
      <button type="button" class="btn btn-secondary" id="copy-plan">Copy Plan</button>
      <button type="button" class="btn btn-primary" id="download-plan">Download Roadmap</button>
      <a class="btn btn-ghost" href="/career-guide">Start Again</a>
    </div>
  </div>

  <div id="results-content" class="results-grid"></div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/career.js') }}"></script>
{% endblock %}
